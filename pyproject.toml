[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quadratic-rough-heston"
authors = [{ name = "Florian Bourgey" }, { name = "Jim Gatheral" }]
version = "0.1.0"
description = "Implementation of the Quadratic Rough Heston model"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=6.29.5",
    "ipython>=9.0.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.1",
    "mpmath>=1.3.0",
    "numfracpy>=0.4",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
